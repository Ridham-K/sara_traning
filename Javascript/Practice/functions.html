<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sayHello(){
            return "Hello World!!";
        }

        function showHello(){
            document.getElementById("demo").innerHTML = sayHello();
        }
    </script>
</head>
<body>
    <p id="demo"></p>
    <button onclick="showHello()">Click Me</button>
</body>
</html>
